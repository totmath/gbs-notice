<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="bgSheen" x1="0%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bellBody" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <filter id="bellGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feFlood flood-color="#a5b4fc" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bgShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="14" stdDeviation="22"
                    flood-color="#0a001e" flood-opacity="0.60"/>
    </filter>

    <filter id="rimDepth" x="-8%" y="-30%" width="116%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#1e0054" flood-opacity="0.30"/>
    </filter>

    <clipPath id="iconClip">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112"/>
    </clipPath>

  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" ry="112"
        fill="url(#bgGrad)" filter="url(#bgShadow)"/>

  <g clip-path="url(#iconClip)">
    <rect x="16" y="16" width="480" height="480" rx="112" ry="112"
          fill="url(#innerGlow)"/>
    <rect x="16" y="16" width="480" height="480" rx="112" ry="112"
          fill="url(#bgSheen)"/>
    <rect x="17" y="17" width="478" height="478" rx="111" ry="111"
          fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="2.5"/>
  </g>

  <g filter="url(#bellGlow)" clip-path="url(#iconClip)">

    <path
      fill="url(#handleGrad)"
      d="
        M 256 104
        C 270 104 282 116 282 130
        C 282 144 270 154 256 154
        C 242 154 230 144 230 130
        C 230 116 242 104 256 104
        Z
        M 256 118
        C 249 118 244 123 244 130
        C 244 137 249 142 256 142
        C 263 142 268 137 268 130
        C 268 123 263 118 256 118
        Z
      "
      fill-rule="evenodd"
    />

    <path
      fill="url(#bellBody)"
      d="
        M 256 148
        C 256 148 238 150 224 157
        C 195 170 172 198 166 232
        C 163 248 163 266 163 284
        L 163 318
        C 148 328 136 340 132 352
        L 380 352
        C 376 340 364 328 349 318
        L 349 284
        C 349 266 349 248 346 232
        C 340 198 317 170 288 157
        C 274 150 256 148 256 148
        Z
      "
    />

    <rect x="120" y="348" width="272" height="32" rx="16" ry="16"
          fill="url(#bellBody)" filter="url(#rimDepth)"/>

    <circle cx="256" cy="406" r="24"
            fill="url(#handleGrad)" filter="url(#rimDepth)"/>

  </g>

</svg>
